function points(key){let a=s.answers[key]||{};

 if(key==='cases')return cases.reduce((n,x,i)=>n+(Number(a[i])===x.right?1:0),0);
 if(key==='pdca'||key==='plan')return a.reduce((n,x,i)=>n+(Number(x)===i?1:0),0);
 if(key==='metrics'){let v=Number(a.sla),b=Number(a.restore);return (a.sla!==''&&a.sla!=null&&Math.abs(v-90)<.11?1:0)+(a.slaStatus==='no'?1:0)+(a.restore!==''&&a.restore!=null&&Math.abs(b-95)<.11?1:0)+(a.restoreStatus==='yes'?1:0);}

function helpContent(){return `<div class="modal" id="helpModal" role="dialog" aria-modal="true" aria-label="Краткий справочник СМК"><div class="modal-card"><div class="modal-header"><div><div class="eyebrow">Краткий справочник</div><h2>Как работает СМК в ИТ-службе</h2></div><button data-action="closeHelp" class="close" aria-label="Закрыть справочник">×</button></div><div class="glossary">
<details open><summary>Что такое СМК?</summary><p>Это согласованная система управления качеством: компания понимает требования заказчика, организует процессы, назначает ответственных, обеспечивает ресурсы, измеряет результаты и постоянно улучшает работу. Для администратора это означает понятный порядок реагирования на инциденты, изменения конфигураций и проверки восстановления.</p></details>
<details><summary>Семь принципов качества</summary><p><b>Ориентация на потребителя:</b> качество сети оценивается и по возможности пользователей работать. <b>Лидерство:</b> руководство устанавливает цели и поддерживает сотрудников. <b>Взаимодействие работников:</b> участники команды понимают роли. <b>Процессный подход:</b> деятельность организована как связанные процессы. <b>Улучшение:</b> организация устраняет причины проблем. <b>Решения на основе свидетельств:</b> используются SLA, журналы, измерения. <b>Менеджмент взаимоотношений:</b> налажены отношения с поставщиками и заказчиками.</p></details>
<details><summary>Коррекция и корректирующее действие</summary><p>При падении VPN коррекцией будет восстановить сервис. Корректирующим действием может быть обнаружение дефекта процедуры обновлений, изменение порядка тестирования, обучение персонала и повторная проверка результата.</p></details>
<details><summary>Процессный подход</summary><p>Вход → работа → выход. Например: заявка сотрудника → диагностика и настройка доступа → работающая сеть. Процессу нужны ответственный, ресурсы, правила, показатели и записи.</p></details>
<details><summary>Показатели SLA и PDCA</summary><p><b>SLA</b> — соглашение об уровне услуги: что именно и при каких условиях обещано заказчику. <b>PDCA</b> — Plan (планирование), Do (выполнение), Check (проверка), Act (улучшение и закрепление). Порог и метод измерения согласуют до оценки.</p></details>
<details><summary>Стандарты и актуальность</summary><p><b>ISO 9000:2026</b> — основы и терминология менеджмента качества. <b>ISO 9001:2026</b> — требования к СМК (опубликован 16 сентября 2026 года). В исходной практической работе описана старая редакция ISO 9001:2008 и восемь исторических принципов. Данное приложение использует семь принципов действующей модели. Важно: приложение — учебная интерпретация, не официальный текст ISO.</p></details>
</div><div class="info blue" style="margin-top:19px"><strong>Официальные источники</strong><p><a href="https://www.iso.org/standard/9001" target="_blank" rel="noopener noreferrer">ISO 9001:2026 — страница стандарта</a></p><p><a href="https://www.iso.org/news/2026/09/ISO9001-2026" target="_blank" rel="noopener noreferrer">ISO — сообщение о редакции 2026 года</a></p><p class="small">Ссылки нужны только для дополнительного чтения; все задания работают без подключения к интернету.</p></div><div class="btnrow"><button class="btn" data-action="closeHelp">Продолжить практикум</button></div></div></div>`}

function feedbackOpen(){const labels=['Причина/проблема','Коррекция','Корректирующее действие','Показатель','Ответственный и ресурсы','Срок и проверка'];const keys=['root','correction','ca','metric','role','deadline'];let missed=keys.filter(k=>s.answers.open[k].trim().length<16);let area=document.getElementById('openFeedback');if(!area)return;area.innerHTML=`<div class="feedback ${missed.length?'warning':''}"><b>${missed.length?`Требуют доработки ${missed.length} из 6 пунктов`:'Все шесть пунктов заполнены'}</b><p>${missed.length?'Раскройте подробнее: '+E(missed.map(k=>labels[keys.indexOf(k)]).join(', '))+'.':'Проверьте, что есть измеримый показатель, конкретный срок и связь корректирующего действия с причиной. Содержательную оценку поставит преподаватель.'}</p></div>`}
function showExample(){let area=document.getElementById('exampleArea');if(!area)return;area.innerHTML=`<div class="info green" style="margin-top:18px"><strong>Один возможный вариант решения (для самопроверки)</strong><p><b>Проблема:</b> повторные кратковременные отказы после изменения конфигураций. <b>Коррекция:</b> восстановить предыдущую рабочую конфигурацию из резервной копии и уведомить пользователей. <b>Корректирующее действие:</b> ввести согласование изменений, тестирование, журнал настроек и план отката. <b>Показатель:</b> снизить повторные инциденты с условных шести до двух в месяц; проверять статистику ежемесячно. <b>Ответственные:</b> ведущий сетевой администратор и руководитель ИТ-отдела; ресурсы — тестовый контур, журнал изменений, мониторинг. <b>Срок:</b> четыре недели на внедрение, затем месяц наблюдения и аудит записей.</p><p class="small">Числа приведены как учебный пример, а не как фактическая статистика компании. Ваш вариант может быть другим, если он обоснован.</p></div>`;}

function saveFile(content,name,mime){let blob=new Blob([content],{type:mime});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2500)}
function reportText(){const r=[];r.push('ПРАКТИЧЕСКАЯ РАБОТА. СИСТЕМА МЕНЕДЖМЕНТА КАЧЕСТВА');r.push('Специальность: 09.02.06 Сетевое и системное администрирование');r.push('Организация кейса: «Технологии будущего» (учебная модель)');r.push('ФИО: '+s.student.name);r.push('Группа: '+s.student.group);r.push('Дата выгрузки: '+new Date().toLocaleString('ru-RU'));r.push('');r.push('АВТОМАТИЧЕСКАЯ ЧАСТЬ');checkedIds.forEach(k=>r.push(`${sections[sectionForId[k]][0]}: ${s.checked[k]?points(k):'не проверено'} / ${maxScores[k]}`));r.push(`Итого: ${summed()} / ${total} (${scorePct()}%)`);r.push('Автоматическая оценка: '+(completed()===9?grade():'не выставлена: не завершены все проверки'));r.push('');r.push('ПИСЬМЕННАЯ СИТУАЦИОННАЯ ЗАДАЧА (проверяет преподаватель)');const label={root:'Выявленная проблема',correction:'Немедленная коррекция',ca:'Корректирующее действие',metric:'Показатель результата',role:'Ответственный и ресурсы',deadline:'Срок и способ проверки'};Object.keys(label).forEach(k=>{r.push(label[k]+':');r.push(s.answers.open[k]||'(ответ отсутствует)');r.push('')});r.push('Критерии содержательной проверки: конкретность проблемы; связь действий с причиной; измеримость; ответственность; сроки; объективные доказательства.');r.push('Примечание: показатели и кейс являются учебными. Основано на адаптированных заданиях практической работы по СМК. Актуальная версия: ISO 9001:2026.');return r.join('\r\n')}
function exportCSV(){let headers=['ФИО','Группа','Дата','Проверенных этапов','Балл','Максимум','Процент','Автооценка',...checkedIds.map(k=>sections[sectionForId[k]][0]),'Пунктов письменного ответа'];let vals=[s.student.name,s.student.group,new Date().toLocaleString('ru-RU'),completed(),summed(),total,scorePct(),completed()===9?grade():'',...checkedIds.map(k=>s.checked[k]?points(k):''),Object.values(s.answers.open).filter(v=>v.trim().length>=16).length];let csv=x=>String(x).includes(';')||String(x).includes('"')||String(x).includes('\n')?'"'+String(x).replaceAll('"','""')+'"':String(x);saveFile('\ufeff'+headers.map(csv).join(';')+'\r\n'+vals.map(csv).join(';')+'\r\n',exportName('csv'),'text/csv;charset=utf-8')}
function exportTXT(){saveFile('\ufeff'+reportText(),exportName('txt'),'text/plain;charset=utf-8')}
function alertReport(t){let c=document.getElementById('reportFeedback');if(c)c.innerHTML=`<div class="feedback warning" role="alert">${E(t)}</div>`}
function saveCheck(type){if(!s.student.name.trim()||!s.student.group.trim()){alertReport('Перед скачиванием заполните ФИО и номер группы на этой странице.');return false}return true}
function action(el){const act=el.dataset.action;const i=Number(el.dataset.i),key=el.dataset.key, v=el.dataset.value;
 if(act==='go'){s.index=Math.max(0,Math.min(sections.length-1,i));selectedTerm=null;persist();render();window.scrollTo(0,0);return}
 if(act==='help'){showHelp=true;render();return}if(act==='closeHelp'){showHelp=false;render();return}
 if(act==='choice'){s.answers[key][i]=Number(v);s.checked[key]=false;render();return}
 if(act==='term'){selectedTerm=i;render();return}
 if(act==='definition'){if(selectedTerm===null)return;Object.keys(s.answers.match).forEach(k=>{if(Number(s.answers.match[k])===i && Number(k)!==selectedTerm)delete s.answers.match[k]});s.answers.match[selectedTerm]=i;selectedTerm=null;s.checked.match=false;render();return}
 if(act==='class'){s.answers.class[i]=v;s.checked.class=false;render();return}
 if(act==='move'){let at=Number(el.dataset.at),to=at+Number(el.dataset.dir);let list=s.answers[key];if(to>=0&&to<list.length){[list[at],list[to]]=[list[to],list[at]];s.checked[key]=false;render()}return}
 if(act==='metricStatus'){s.answers.metrics[key]=v;s.checked.metrics=false;render();return}
 if(act==='check'){setChecked(key);return}
 if(act==='redo'){if(!confirm('Очистить ответы только на этом этапе?'))return;s.answers[key]=deepCopy(seed.answers[key]);s.checked[key]=false;selectedTerm=null;render();return}
 if(act==='reviewOpen'){feedbackOpen();return}if(act==='example'){showExample();return}
 if(act==='downloadTxt'){if(saveCheck())exportTXT();return}if(act==='downloadCsv'){if(saveCheck())exportCSV();return}
 if(act==='print'){window.print();return}
 if(act==='resetAll'){if(confirm('Очистить все решения и результаты этого практикума?')){s=deepCopy(seed);selectedTerm=null;showHelp=false;render()}return}
}
document.addEventListener('click',e=>{let el=e.target.closest('[data-action]');if(el && !el.disabled){e.preventDefault();action(el)}});
document.addEventListener('input',e=>{let t=e.target;if(!t.dataset.scope)return;let sc=t.dataset.scope,k=t.dataset.field;s.checked.metrics=sc==='metrics'?false:s.checked.metrics;if(sc==='student'){s.student[k]=t.value}else if(sc==='metrics'){s.answers.metrics[k]=t.value}else if(sc==='open'){s.answers.open[k]=t.value}persist()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&showHelp){showHelp=false;render()}});
render();
})();
</script>
</body>
</html>
